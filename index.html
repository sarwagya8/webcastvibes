<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WebCast Vibes</title>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  font-size: 16px;
}

iframe {
  width: 100%;
  height: 500px;
  border: 1px solid #ccc;
}

.video {
  border: 1px solid #aaa;
  padding: 10px;
  margin: 10px 0;
  word-break: break-all;
}

</style>

</head>


<body>

<h2>WebCast Vibes</h2>


<input id="url"
placeholder="Enter website URL"
value="https://samplelib.com">


<button onclick="openSite()">
Open Website
</button>


<button onclick="scanVideos()">
Find Videos
</button>


<iframe id="browser"></iframe>


<h3>
Detected Videos
</h3>


<div id="results">
None yet
</div>



<script>


let currentURL = "";



function openSite(){

 let url =
 document.getElementById("url").value.trim();


 if(!url.startsWith("http")){
   url="https://"+url;
 }


 currentURL=url;


 document.getElementById("browser")
 .src=url;


 document.getElementById("results")
 .innerHTML="Page loaded. Scan for videos.";

}





function scanVideos(){


 let iframe =
 document.getElementById("browser");


 let results =
 document.getElementById("results");


 try{


 let doc =
 iframe.contentDocument ||
 iframe.contentWindow.document;



 let videos =
 [];


 // video tags

 doc.querySelectorAll("video")
 .forEach(v=>{


   if(v.src)
     videos.push(v.src);


 });



 // source tags

 doc.querySelectorAll("source")
 .forEach(s=>{


   if(s.src)
     videos.push(s.src);


 });



 // search html

 let html =
 doc.documentElement.innerHTML;


 let matches =
 html.match(
 /(https?:\/\/[^"'\\s]+\\.(mp4|m3u8)[^"'\\s]*)/gi
 );


 if(matches){

   videos =
   videos.concat(matches);

 }



 videos =
 [...new Set(videos)];



 if(videos.length===0){

  results.innerHTML =
  "No videos found";

  return;

 }



 results.innerHTML="";


 videos.forEach(function(url,index){


  let div =
  document.createElement("div");


  div.className="video";


  div.innerHTML =
  "<b>Video "+(index+1)+"</b><br>"+
  url+
  "<br><button onclick=\"castVideo('"+
  encodeURIComponent(url)+
  "')\">Cast</button>";


  results.appendChild(div);


 });



 }

 catch(e){


 results.innerHTML =
 "Cannot scan this site.<br>"+
 "Browser security blocked access.";


 }



}





function castVideo(url){

 alert(
 "Casting will be added next.\n\n"+
 decodeURIComponent(url)
 );

}


</script>


</body>
</html>
