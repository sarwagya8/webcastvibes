<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WebCast Vibes</title>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  width:100%;
  padding:14px;
  margin:8px 0;
  font-size:16px;
}

google-cast-launcher {
  width:60px;
  height:60px;
  display:block;
}

#status {
  margin-top:20px;
  border:1px solid #aaa;
  padding:10px;
}
</style>

</head>

<body>

<h2>WebCast Vibes</h2>

<input id="url"
value="https://samplelib.com/mp4/sample-5s.mp4">

<google-cast-launcher></google-cast-launcher>

<button onclick="playVideo()">
Play on Chromecast
</button>


<div id="status">
Loading Cast...
</div>


<script>

let castSession = null;


window.__onGCastApiAvailable = function(isAvailable){

  if(!isAvailable){

    status("Cast unavailable");
    return;

  }


  const context =
    cast.framework.CastContext.getInstance();


  context.setOptions({

    receiverApplicationId:
      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:
      chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED

  });



  context.addEventListener(

    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,

    function(event){


      console.log(
        "Session state:",
        event.sessionState
      );


      if(
        event.sessionState ===
        cast.framework.SessionState.SESSION_STARTED
        ||
        event.sessionState ===
        cast.framework.SessionState.SESSION_RESUMED
      ){

        castSession =
          context.getCurrentSession();


        document.getElementById("status")
        .innerText =
        "Connected";

      }


      if(
        event.sessionState ===
        cast.framework.SessionState.SESSION_ENDED
      ){

        castSession=null;

        document.getElementById("status")
        .innerText =
        "Disconnected";

      }


    }

  );


  document.getElementById("status")
  .innerText =
  "Cast ready";

};





function playVideo(){

  if(!castSession){

    document.getElementById("status")
    .innerText =
    "Connect Chromecast first";

    return;

  }


  let url =
    document.getElementById("url")
    .value;


  let type =
    url.includes(".m3u8")
    ?
    "application/x-mpegurl"
    :
    "video/mp4";


  let mediaInfo =
    new chrome.cast.media.MediaInfo(
      url,
      type
    );


  mediaInfo.streamType =
    chrome.cast.media.StreamType.BUFFERED;


  let request =
    new chrome.cast.media.LoadRequest(
      mediaInfo
    );


  request.autoplay=true;



  castSession.loadMedia(request)
  .then(()=>{

    document.getElementById("status")
    .innerText =
    "Playing";

  })
  .catch(err=>{

    document.getElementById("status")
    .innerText =
    "Media error: "+
    JSON.stringify(err);

  });


}

</script>

</body>
</html>
