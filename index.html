<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WebCast Vibes</title>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
}

#status {
  margin-top: 20px;
  padding: 12px;
  border: 1px solid #aaa;
  white-space: pre-wrap;
}
</style>

</head>

<body>

<h2>WebCast Vibes</h2>

<input
id="url"
value="https://samplelib.com/mp4/sample-5s.mp4"
placeholder="Video URL">


<button onclick="castVideo()">
Cast Video
</button>


<button onclick="disconnect()">
Disconnect
</button>


<div id="status">
Starting...
</div>


<script>

let session = null;
let castReady = false;


function log(message) {

  console.log(message);

  document.getElementById("status").innerText =
    message;
}



window.__onGCastApiAvailable = function(isAvailable) {


  if (!isAvailable) {

    log("Cast SDK failed to load");

    return;
  }



  let sessionRequest =
    new chrome.cast.SessionRequest(
      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID
    );



  let apiConfig =
    new chrome.cast.ApiConfig(

      sessionRequest,

      function(session) {

        console.log(
          "Session created",
          session
        );

        onSessionCreated(session);

      },


      function(availability) {

        console.log(
          "Receiver availability:",
          availability
        );


        if (
          availability === "available"
        ) {

          log(
            "Chromecast found. Ready."
          );

        } else {

          log(
            "Waiting for Chromecast..."
          );

        }

      }
    );



  chrome.cast.initialize(

    apiConfig,

    function() {

      castReady = true;

      log(
        "Cast initialized"
      );

    },


    function(error) {

      log(
        "Initialization error: " +
        JSON.stringify(error)
      );

    }

  );

};





function castVideo() {


  if (!castReady) {

    log(
      "Cast not ready yet"
    );

    return;

  }



  log(
    "Opening Chromecast selector..."
  );



  chrome.cast.requestSession(

    function(newSession) {

      onSessionCreated(newSession);

    },


    function(error) {

      console.error(error);


      log(
        "Session error:\n" +
        JSON.stringify(error)
      );

    }

  );

}





function onSessionCreated(newSession) {


  session = newSession;


  log(
    "Connected. Loading video..."
  );



  let url =
    document.getElementById("url")
    .value.trim();



  let contentType =
    "video/mp4";



  if (
    url.toLowerCase()
    .includes(".m3u8")
  ) {

    contentType =
      "application/x-mpegurl";

  }



  let mediaInfo =
    new chrome.cast.media.MediaInfo(
      url,
      contentType
    );



  mediaInfo.streamType =
    chrome.cast.media.StreamType.BUFFERED;



  let request =
    new chrome.cast.media.LoadRequest(
      mediaInfo
    );



  request.autoplay = true;



  session.loadMedia(

    request,


    function() {

      log(
        "Playing on Chromecast"
      );

    },


    function(error) {

      log(
        "Media error:\n" +
        JSON.stringify(error)
      );

    }

  );

}





function disconnect() {


  if (session) {


    session.stop(

      function() {

        session = null;

        log(
          "Disconnected"
        );

      }

    );


  } else {

    log(
      "No active session"
    );

  }

}

</script>


</body>
</html>
