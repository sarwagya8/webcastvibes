<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebCast Vibes</title>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
}

#status {
  margin-top:20px;
  padding:10px;
  border:1px solid #ccc;
}
</style>

</head>

<body>

<h2>WebCast Vibes</h2>

<input id="url"
value="https://samplelib.com/mp4/sample-5s.mp4"
placeholder="Video URL">

<button onclick="connectCast()">
Cast Video
</button>

<button onclick="resetCast()">
Reset Cast
</button>

<div id="status">
Loading Cast...
</div>


<script>

let context;
let sessionReady = false;


function log(msg){
  console.log(msg);
  document.getElementById("status").innerText = msg;
}


window.__onGCastApiAvailable = function(available){

  if(!available){
    log("Cast SDK unavailable");
    return;
  }


  context =
    cast.framework.CastContext.getInstance();


  context.setOptions({

    receiverApplicationId:
      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:
      chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED

  });


  context.addEventListener(
    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
    function(event){

      console.log(
        "Session:",
        event.sessionState
      );


      if(
        event.sessionState ===
        cast.framework.SessionState.SESSION_STARTED
        ||
        event.sessionState ===
        cast.framework.SessionState.SESSION_RESUMED
      ){

        sessionReady = true;

        log(
          "Chromecast connected. Loading video..."
        );

        sendVideo();

      }


      if(
        event.sessionState ===
        cast.framework.SessionState.SESSION_ENDED
      ){

        sessionReady=false;
        log("Disconnected");

      }

    }
  );


  log("Cast ready");

};



function connectCast(){

  if(!context){
    log("Cast not ready yet");
    return;
  }


  log(
    "Opening Chromecast selector..."
  );


  context.requestSession()
  .then(function(){

    console.log(
      "requestSession complete"
    );

  })
  .catch(function(error){

    console.error(error);

    log(
      "Cast connection failed: "+
      JSON.stringify(error)
    );

  });


  setTimeout(function(){

    if(!sessionReady){

      log(
        "No connection after 15 seconds. Try Reset."
      );

    }

  },15000);

}




function sendVideo(){

  let session =
    context.getCurrentSession();


  if(!session){

    log("No session found");
    return;

  }


  let url =
    document.getElementById("url")
    .value.trim();


  let type =
    url.includes(".m3u8")
    ?
    "application/x-mpegurl"
    :
    "video/mp4";


  let mediaInfo =
    new chrome.cast.media.MediaInfo(
      url,
      type
    );


  mediaInfo.streamType =
    chrome.cast.media.StreamType.BUFFERED;


  let request =
    new chrome.cast.media.LoadRequest(
      mediaInfo
    );


  request.autoplay=true;


  session.loadMedia(request)

  .then(function(){

    log(
      "Playing on Chromecast"
    );

  })

  .catch(function(error){

    console.error(error);

    log(
      "Media error: "+
      JSON.stringify(error)
    );

  });

}



function resetCast(){

  if(context){

    context.endCurrentSession(true);

  }

  sessionReady=false;

  log(
    "Reset complete"
  );

}


</script>

</body>
</html>
