<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WebCast Vibes</title>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
}

#status {
  margin-top:20px;
  padding:10px;
  border:1px solid #ccc;
}
</style>

</head>

<body>

<h2>WebCast Vibes</h2>

<input id="url"
value="https://samplelib.com/mp4/sample-5s.mp4">

<button onclick="castVideo()">
Cast Video
</button>

<button onclick="disconnect()">
Disconnect
</button>

<div id="status">
Loading...
</div>


<script>

let session = null;
let initialized = false;


function status(text){
  document.getElementById("status").innerText=text;
}


window.__onGCastApiAvailable = function(isLoaded,error){

  if(!isLoaded){
    status("Cast SDK failed: "+error);
    return;
  }


  const sessionRequest =
    new chrome.cast.SessionRequest(
      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID
    );


  const apiConfig =
    new chrome.cast.ApiConfig(
      sessionRequest,
      onSessionCreated,
      receiverListener
    );


  chrome.cast.initialize(
    apiConfig,
    function(){
      initialized=true;
      status("Cast ready");
    },
    function(error){
      status(
        "Init error: "+
        JSON.stringify(error)
      );
    }
  );

};



function receiverListener(availability){

  console.log(
    "Receiver:",
    availability
  );

}



function castVideo(){

  if(!initialized){
    status("Cast not initialized");
    return;
  }


  status(
    "Opening Chromecast selector..."
  );


  chrome.cast.requestSession(
    onSessionCreated,
    function(error){

      console.log(error);

      status(
        "Session error: "+
        JSON.stringify(error)
      );

    }
  );

}



function onSessionCreated(e){

  session=e;

  status(
    "Connected. Loading video..."
  );


  let url =
    document.getElementById("url").value.trim();


  let type =
    url.includes(".m3u8")
    ?
    "application/x-mpegurl"
    :
    "video/mp4";


  let mediaInfo =
    new chrome.cast.media.MediaInfo(
      url,
      type
    );


  let request =
    new chrome.cast.media.LoadRequest(
      mediaInfo
    );


  request.autoplay=true;


  session.loadMedia(
    request,
    function(){

      status(
        "Playing on Chromecast"
      );

    },
    function(error){

      status(
        "Media error: "+
        JSON.stringify(error)
      );

    }
  );

}



function disconnect(){

  if(session){

    session.stop(
      function(){
        status("Disconnected");
      }
    );

  }

}

</script>

</body>
</html>
